<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login • SavePoint</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body class="login-bg" data-theme="light">
  <main class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">Admin Portal</h1>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST" class="login-form">
        <div class="input-pill">
          <span class="pill-icon">🛡️</span>
          <input name="username" placeholder="Admin username" autocomplete="username" required />
        </div>

        <div class="input-pill">
          <span class="pill-icon">🔐</span>
          <input name="password" type="password" placeholder="Admin password" autocomplete="current-password" required />
        </div>

        <div class="input-pill">
          <span class="pill-icon">🧩</span>
          <input name="setup_code" placeholder="Setup code (only for first-time admin creation)" />
        </div>

        <div class="login-actions">
          <button class="primary-btn login-btn" type="submit">Enter Admin</button>
          <a class="link" href="/login">User login</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
