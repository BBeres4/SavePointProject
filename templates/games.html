<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Games • SavePoint</title>
<link rel="stylesheet" href="/static/styles.css"/>
</head>

<body data-theme="{{ ui_theme|default('light') }}">
  
{% set active='games' %}
{% include "partials_nav.html" %}

<div class="page">

<section class="games-search-panel">

<div class="games-search-header">

<div>
<p class="section-kicker">Explore the library</p>
<h1 class="page-title">Games</h1>
</div>

<div class="search-wrap">
<span class="search-icon">⌕</span>
<input id="searchInput" class="search" placeholder="Search any game..."/>
</div>

</div>

<div class="filters">

<select id="yearFilter">
<option value="">Year</option>
<option value="2026">2026</option>
<option value="2025">2025</option>
<option value="2024">2024</option>
<option value="2023">2023</option>
<option value="2022">2022</option>
<option value="2021">2021</option>
<option value="2020">2020</option>
<option value="2015-2019">2015–2019</option>
<option value="2010-2014">2010–2014</option>
<option value="2000-2009">2000–2009</option>
</select>

<select id="genreFilter">
<option value="">Genre</option>
<option value="Action">Action</option>
<option value="RPG">RPG</option>
<option value="Adventure">Adventure</option>
<option value="Shooter">Shooter</option>
<option value="Open World">Open World</option>
<option value="Sports">Sports</option>
<option value="Racing">Racing</option>
<option value="Fighting">Fighting</option>
<option value="Horror">Horror</option>
<option value="Platformer">Platformer</option>
<option value="Puzzle">Puzzle</option>
</select>

<select id="ratingFilter">
<option value="">Rating</option>
<option value="4.5">4.5+</option>
<option value="4.0">4.0+</option>
<option value="3.5">3.5+</option>
<option value="3.0">3.0+</option>
</select>

<select id="sortFilter">
<option value="">Sort</option>
<option value="rating_desc">Highest Rated</option>
<option value="rating_asc">Lowest Rated</option>
<option value="year_desc">Newest</option>
<option value="year_asc">Oldest</option>
<option value="name_asc">A-Z</option>
<option value="name_desc">Z-A</option>
</select>

</div>

</section>


<section class="section is-hidden" id="searchSection">

<div class="section-head">

<div>
<p class="section-kicker">Live search</p>
<h2>Search Results</h2>
</div>

<div id="resultsCount" class="muted"></div>

</div>

<div id="searchGrid" class="grid games-grid search-results-grid"></div>

</section>


<section class="section" id="popularSection">

<div class="section-head">
<div>
<p class="section-kicker">Browse the catalog</p>
<h2>All Games</h2>
</div>
</div>

<div id="popularGrid" class="grid games-grid"></div>

</section>


</div>

<script src="/static/app.js"></script>

<script>
loadGamesPage();
</script>

</body>
</html>
