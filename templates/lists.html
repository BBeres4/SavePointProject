<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lists • SavePoint</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  {% set active='lists' %}
  {% include "partials_nav.html" %}

  <div class="page">
    <section class="lists-hero">
      <div>
        <p class="section-kicker">Collections</p>
        <h1 class="page-title">Your Game Lists</h1>
        <div class="lists-help muted">
          Create custom lists to organize, rank, and revisit the games that matter to you.
        </div>

      <button id="createListBtn" class="primary-btn">Create List +</button>

    <div class="lists-hint-card">

    <div id="listsGrid" class="lists-grid"></div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    loadListsPage();
  </script>
