<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login • SavePoint</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body class="login-bg" data-theme="{{ ui_theme|default('light') }}">
  <main class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">Login</h1>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST" class="login-form">
        <div class="input-pill">
          <span class="pill-icon">👤</span>
          <input
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
          />
        </div>

        <div class="input-pill">
          <span class="pill-icon">🔒</span>
          <input
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="login-actions">
          <button class="primary-btn login-btn" type="submit">Login</button>
          <a class="link" href="/signup">Create account</a>
        </div>

        <p class="hint">
          New here? Click <b>Create account</b> to sign up.
        </p>
                <p class="hint">
          Admin? Use the separate <a class="link" href="/admin/login">Admin portal</a>.
        </p>
      </form>
    </div>
  </main>
</body>
</html>
