<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Settings • SavePoint</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body data-theme="{{ ui_theme|default('light') }}">
  {% set active='profile' %}
  {% include "partials_nav.html" %}

  <div class="page">
    <h2>Settings</h2>

    <div class="settings-section">
      <h3>Account</h3>

      <form method="POST" enctype="multipart/form-data">
        <label for="settings-username">Username</label>
        <input id="settings-username" name="username" value="{{ user.username }}" />

        <label for="settings-password">New Password</label>
        <input
          id="settings-password"
          type="password"
          name="password"
          placeholder="Leave blank to keep current"
        />

        <label for="settings-theme">Theme</label>
        <select id="settings-theme" name="theme_preference">
          <option value="light" {% if user.theme_preference == 'light' %}selected{% endif %}>Light mode</option>
          <option value="dark" {% if user.theme_preference == 'dark' %}selected{% endif %}>Dark mode</option>
        </select>

        <label for="settings-profile-pic">Profile Picture</label>
        <input id="settings-profile-pic" type="file" name="profile_pic" accept="image/*" />

        <label class="checkbox-row" for="settings-remove-pic">
          <input id="settings-remove-pic" type="checkbox" name="remove_pic" />
          <span>Remove current picture</span>
        </label>

        <button class="primary-btn" type="submit">Save Changes</button>
      </form>
    </div>

    <!-- PREFERENCES -->
    <div class="settings-section">
      <h3>Preferences</h3>
   <p>Choose your theme preference. Notifications are coming soon.</p>
    </div>

  </div>
</body>
</html>
